<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="stylesheet" href="ultah cica.css">
</head>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun, Sayang!</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(to bottom, #ff9a9e, #fecfef);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            transition: background 0.5s ease; /* Transisi untuk perubahan halaman */
        }
        .page {
            display: none; /* Semua halaman disembunyikan secara default */
            background: white;
            border-radius: 30px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            position: relative;
            animation: pageAppear 0.5s ease-out;
        }
        @keyframes pageAppear {
            from { transform: scale(0.8); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .page.active {
            display: block; /* Tampilkan halaman aktif */
        }
        h1 {
            color: #ff6b6b;
            font-size: 2.5em;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
        p {
            color: #333;
            font-size: 1.2em;
            margin: 20px 0;
        }
        .heart {
            color: #ff4757;
            font-size: 3em;
            animation: heartbeat 1.5s infinite;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .balloon {
            position: absolute;
            font-size: 2em;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .balloon:nth-child(1) { top: 10%; left: 10%; color: #ff6b6b; }
        .balloon:nth-child(2) { top: 20%; right: 15%; color: #4ecdc4; }
        .balloon:nth-child(3) { top: 30%; left: 20%; color: #45b7d1; }
        .nav-buttons {
            margin: 20px 0;
        }
        .nav-buttons button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            margin: 0 5px;
            transition: background 0.3s ease;
        }
        .nav-buttons button:hover {
            background: #ff4757;
        }
        /* Halaman Foto */
        .photo-upload {
            margin: 20px 0;
        }
        #photo {
            display: none;
        }
        #photo-preview {
            max-width: 200px;
            max-height: 200px;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
            transition: all 0.8s ease;
            animation: photoSlideIn 1s ease-out;
        }
        @keyframes photoSlideIn {
            from { transform: scale(0.5) translateY(50px); opacity: 0; }
            to { transform: scale(1) translateY(0); opacity: 1; }
        }
        #photo-preview.loaded {
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        #photo-preview:hover {
            animation: wiggleRotate 0.6s ease-in-out infinite;
        }
        @keyframes wiggleRotate {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg) translateX(-2px); }
            50% { transform: rotate(5deg) translateX(2px); }
            75% { transform: rotate(-5deg) translateX(-2px); }
        }
        /* Halaman Boneka */
        
        
        .doll-button {
            background: #ff6b6b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1em;
            margin-top: 20px;
        }
        .doll-button:hover {
            background: #ff4757;
        }
    </style>
</head>
<body>
    <!-- Halaman Utama -->
    <div class="page active" id="home-page">
        <i class="fas fa-birthday-cake balloon"></i>
        <i class="fas fa-gift balloon"></i>
        <i class="fas fa-star balloon"></i>
        <h1>Selamat Ulang Tahun, Sayang!</h1>
        <p>Semoga dihari ultah kamu ini penuh dengan ke bahagiaan,aminnn sayang:3</p>
        <i class="fas fa-heart heart"></i>
        <div class="nav-buttons">
            <button onclick="showPage('photo-page')">Apa Hayooo</button>
            <button onclick="showPage('doll-page')">Kalo ini apa yaaa</button>
        </div>
    </div>

    <!-- Apa Hayooo -->
    <div class="page" id="photo-page">
        <h1>tadaaaa</h1>
        <p>happy birth day cantikkk,lucu kannn, yeyyyy hihi:3</p>
        <div class="container">
            <img src="cica.jpg">
        </div>
        <div class="nav-buttons">
            <button onclick="showPage('home-page')">coba lihat yang lain yuk</button>
        </div>
    </div>

    <!-- Halaman Boneka -->
    <div class="page" id="doll-page">
        <h1>HEHE</h1>
        <p>semogakitaselalu bersama sampai ketemu ya sayang:3</p>
        <div class="doll-container">
            <div class="doll" id="doll">
                <img src="aku.jpg"
            </div>
        </div>
        <div class="nav-buttons">
            <button onclick="showPage('home-page')">Kembali ke Utama</button>
        </div>
    </div>

    <script>
        function showPage(pageId) {
            // Sembunyikan semua halaman
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.classList.remove('active'));
            // Tampilkan halaman yang dipilih
            document.getElementById(pageId).classList.add('active');
        }

        function previewPhoto() {
            const file = document.getElementById('photo').files[0];
            const preview = document.getElementById('photo-preview');
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    preview.classList.add('loaded');
                };
                reader.readAsDataURL(file);
            }
        }

        function startDollDance() {
            const doll = document.getElementById('doll');
            doll.style.animationPlayState = 'running'; // Mulai animasi jika belum
        }
    </script>
</body>
</html>
